function setPrio(prio) {
	let val = '';
	for (let i = 0; i < prio; i++) {
		val += '&#128293;';
	}
	if (prio == 0) val = '&#10067;';
	
	switch(prio) {
		case 0: type = 'unknown'; break;
		case 1: type = 'low'; break;
		case 2: type = 'medium'; break;
		case 3: type = 'high'; break;
		default: type = 'unknown'; break;
	}
	let str = '<a title="priority ' + type + '">' + val + '</a>';
	return str;
}

function createLinks(set, asWishlist) {
	let info = '';
	let shop = '';
	
	for (let link of Object.keys(set.links)) {
		switch(link) {
			case 'wiki':
			case 'resources':
			//case 'sylvanian':
				info += '' +
				'<a href="' + set.links[link] + '" ' +
						'title="' + link + '" ' +
						'class="color_info" ' +
						'target="_blank">'+
					'<span class="material-symbols-rounded">info</span> <span>' + link + '</span>' +
				'</a>';
				break;
			case 'shop':
			case 'smyths':
			case 'thalia':
			case 'otto':
			case 'amazon':
				shop += '' +
				'<a href="' + set.links[link] + '" ' +
						'title="' + link + '" ' +
						'class="color_shop">' +
					'<span>' + link + '</span> <span class="material-symbols-rounded">shopping_cart</span>' +
				'</a>';
				break;
		}
	}
	return '<div class="links">' +
		'<div class="left">' + info + '</div>' +
		(asWishlist ? '<div class="right">' + shop + '</div>' : '') +
	'</div>';
}

function formatPrice(price) {
	return price.replace('.00', '') + ' €';
}

function createSet(set, asWishlist) {
	return '' +
		'<div class="image">' + 
			'<img src="' + set.img + '">' + 
		'</div>' + 
		'<div class="info">' + 
			'<div class="left">' +
				(set.count ? set.count + 'x ' : '') +
				set.name +
				(set.release ? ' (' + set.release + ')' : '' ) +
				(set.exclusive ? '<a title="Sylvanian Families Online Store Exclusive"><b>*</b></a>' : '') + 
				((set.price && asWishlist) ? '<br><b>' + formatPrice(set.price) + '</b>' : '' ) +
				(set.figure && !asWishlist ? '<br><i>' + set.figure + '</i>' : '') +
			'</div>' +
			'<div class="right">' +
				(set.id ? '<div class="id">#' + set.id + '</div>' : '') +
				(asWishlist ? '<div class="prio">' + setPrio(set.prio) + '</div>' : '') +
			'</div>' +
		'</div>' +
		'<div class="overlay">' +
			createLinks(set, asWishlist) +
		'</div>';
}

$(document).ready(function() {

	for (let i = 0; i < links.length; i++) {
		let link = links[i];
		let icon = (link.type == 'shop') ? 'shopping_cart' : 'info';
	
		$('#links').append(
			'<a class="link color_' + link.type + '" ' +
					'href="' + link.link + '" ' +
					'target="_blank">' +
				'<span class="material-symbols-rounded">' + icon + '</span>' + link.title +
			'</a>' +
		'');
	}

	let price = 0;
	
	for (let i = 0; i < wishlist.length; i++) {
		let set = wishlist[i];
	
		$('#wishlist').append(
			'<div class="set ' + (set.hide ? 'hide' : '') + '">' +
				createSet(set, true) +
			'</div>'  +
		'');
		if (set.price && !set.hide) price += parseFloat(set.price);
	}
	
	let total = 'total price: ' + price + ' €';
	console.log(total);
	//$('#content').append(total);
	
	for (let i = 0; i < exists.length; i++) {
		let set = exists[i];
	
		$('#exists').append(
			'<div class="set">' +
				createSet(set, false) +
			'</div>' +
		'');
	}
	
	for (let i = 0; i < fleamarket.length; i++) {
		let set = fleamarket[i];
	
		$('#fleamarket').append(
			'<div class="set">' +
				'<div class="image">' + 
					'<img src="' + set.img + '">' + 
				'</div>' + 
				'<div class="info">' + set.name + ' (' + set.id + ')' + 
					(set.figure ? '<br><i>' + set.figure + '</i>' : '') + 
					((set.includes || set.missing) ? '<br><i>' : '') +
					(set.includes ? 'Includes: ' + set.includes : '') +
					(set.missing ? 'Missing: ' + set.missing : '') +
					((set.includes || set.missing) ? '</i>' : '') +
				'</div>' +
				'<div class="overlay">' +
					createLinks(set, false) +
				'</div>' +
			'</div>'  +
		'');
	}
	
});
